<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#2A2145" />
      <stop offset="55%" stop-color="#1A1430" />
      <stop offset="100%" stop-color="#0D0A1A" />
    </radialGradient>
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5A87E" />
      <stop offset="60%" stop-color="#E8825A" />
      <stop offset="100%" stop-color="#6B3A4A" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bgGlow)"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="#3D2E4A" stroke-width="2" opacity="0.6"/>
  <!-- Cinematic Chat / Roleplay Sigil -->
  <g filter="url(#glow)">
    <!-- Elegant Crescent -->
    <path d="M 230 140 C 310 140 370 200 370 280 C 370 330 345 365 315 385 C 335 365 345 330 345 290 C 345 220 290 170 215 170 C 185 170 160 180 145 195 C 160 160 190 140 230 140 Z" fill="url(#coralGrad)"/>
    <!-- 4-pointed Star ✦ -->
    <path d="M 290 180 C 290 220 310 240 350 240 C 310 240 290 260 290 300 C 290 260 270 240 230 240 C 270 240 290 220 290 180 Z" fill="#F5A87E"/>
    <!-- Subtle secondary star -->
    <path d="M 190 310 C 190 330 200 340 220 340 C 200 340 190 350 190 370 C 190 350 180 340 160 340 C 180 340 190 330 190 310 Z" fill="#E8825A" opacity="0.85"/>
